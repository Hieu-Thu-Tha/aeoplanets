name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  detect-test-changes:
    name: Detect test changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.changes.outputs.should_run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check relevant paths
        id: changes
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- \
            client \
            server \
            shared \
            test \
            migrations \
            scripts \
            package.json \
            package-lock.json \
            tsconfig.json \
            vite.config.ts \
            drizzle.config.ts \
            postcss.config.js \
            tailwind.config.ts; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "No test-relevant files changed; skipping tests."
          else
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  run-tests:
    name: Run tests
    needs: detect-test-changes
    if: ${{ needs.detect-test-changes.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aeostars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aeostars_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aeostars_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/aeostars_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
