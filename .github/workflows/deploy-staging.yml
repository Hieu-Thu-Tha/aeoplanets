name: Deploy Tag to Staging

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to deploy (for example, 0.0.1)
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: https://${{ vars.STAGING_HOST }}

    steps:
      - name: Checkout selected tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Validate tag
        env:
          DEPLOY_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! "$DEPLOY_TAG" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid tag '$DEPLOY_TAG'; expected X.Y.Z" >&2
            exit 1
          fi

          git fetch origin main --tags --force
          if ! git rev-parse --verify --quiet "refs/tags/${DEPLOY_TAG}^{commit}" >/dev/null; then
            echo "Tag '$DEPLOY_TAG' does not exist" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "refs/tags/${DEPLOY_TAG}^{commit}" origin/main; then
            echo "Tag '$DEPLOY_TAG' is not reachable from main" >&2
            exit 1
          fi

      - name: Install migration dependencies
        run: npm ci

      - name: Back up and migrate staging database
        id: backup
        env:
          DEPLOY_ENVIRONMENT: staging
          DEPLOY_TAG: ${{ inputs.tag }}
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.STAGING_BACKUP_ENCRYPTION_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.STAGING_BACKUP_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.STAGING_BACKUP_S3_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.STAGING_BACKUP_S3_SESSION_TOKEN }}
          BACKUP_S3_REGION: ${{ vars.STAGING_BACKUP_S3_REGION }}
          BACKUP_S3_BUCKET: ${{ vars.STAGING_BACKUP_S3_BUCKET }}
          BACKUP_S3_ENDPOINT: ${{ vars.STAGING_BACKUP_S3_ENDPOINT }}
          POSTGRES_IMAGE: postgres:18-alpine
        run: node_modules/.bin/tsx scripts/run-migrations.ts --backup

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve immutable staging image
        id: image
        env:
          DEPLOY_TAG: ${{ inputs.tag }}
          IMAGE_NAME: ghcr.io/aeostars/aeostarsinsight
        run: |
          set -euo pipefail
          image_tag="v${DEPLOY_TAG}"
          image_digest="$(docker buildx imagetools inspect \
            "${IMAGE_NAME}:${image_tag}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [[ "$image_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "tag=$image_tag" >> "$GITHUB_OUTPUT"
          echo "digest=$image_digest" >> "$GITHUB_OUTPUT"

      - name: Load trusted deployment client
        run: |
          set -euo pipefail
          git show origin/main:scripts/redeploy-staging.sh > "$RUNNER_TEMP/redeploy-staging.sh"
          chmod 700 "$RUNNER_TEMP/redeploy-staging.sh"

      - name: Deploy selected tag
        id: deploy
        env:
          DEPLOY_TAG: ${{ inputs.tag }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          STAGING_WEBHOOK_TOKEN: ${{ secrets.STAGING_WEBHOOK_TOKEN }}
          STAGING_REGISTRY_USER: ${{ github.actor }}
          STAGING_REGISTRY_TOKEN: ${{ github.token }}
          STAGING_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          STAGING_DATABASE_URL_SHA256: ${{ steps.backup.outputs.database_url_sha256 }}
        run: bash "$RUNNER_TEMP/redeploy-staging.sh" "$DEPLOY_TAG"

      - name: Deployment summary
        if: always()
        env:
          DEPLOY_TAG: ${{ inputs.tag }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
          BACKUP_URI: ${{ steps.backup.outputs.object_uri }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          DEPLOY_RESULT: ${{ steps.deploy.outcome }}
        run: |
          {
            echo "## Staging deployment"
            echo ""
            echo "- Tag: \`$DEPLOY_TAG\`"
            echo "- Host: \`$STAGING_HOST\`"
            echo "- Image digest: \`$IMAGE_DIGEST\`"
            echo "- Database backup: \`${BACKUP_URI:-not created}\`"
            echo "- Result: \`$DEPLOY_RESULT\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Record staging release
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.created }}
    permissions:
      contents: write

    steps:
      - name: Create or update GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOY_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if ! gh release view "$DEPLOY_TAG" >/dev/null 2>&1; then
            gh release create "$DEPLOY_TAG" \
              --verify-tag \
              --title "$DEPLOY_TAG" \
              --generate-notes
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

          CURRENT_NOTES="$(mktemp)"
          CLEAN_NOTES="$(mktemp)"
          UPDATED_NOTES="$(mktemp)"
          gh release view "$DEPLOY_TAG" --json body --jq .body > "$CURRENT_NOTES"

          PRODUCTION_CHECKED="false"
          if grep -qE '^- \[[xX]\] Production[[:space:]]*$' "$CURRENT_NOTES"; then
            PRODUCTION_CHECKED="true"
          fi

          awk '
            tolower($0) == "## deployments" { skipping = 1; next }
            skipping && /^## / { skipping = 0 }
            !skipping { print }
          ' "$CURRENT_NOTES" > "$CLEAN_NOTES"

          {
            cat "$CLEAN_NOTES"
            printf '\n## Deployments\n\n'
            printf '%s\n' '- [x] Staging'
            if [ "$PRODUCTION_CHECKED" = "true" ]; then
              printf '%s\n' '- [x] Production'
            else
              printf '%s\n' '- [ ] Production'
            fi
          } > "$UPDATED_NOTES"

          gh release edit "$DEPLOY_TAG" --notes-file "$UPDATED_NOTES"

      - name: Deployment summary
        if: always()
        env:
          DEPLOY_TAG: ${{ inputs.tag }}
          RELEASE_RESULT: ${{ steps.release.outcome }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ inputs.tag }}
        run: |
          {
            echo "## GitHub Release"
            echo ""
            echo "- Tag: \`$DEPLOY_TAG\`"
            echo "- Result: \`$RELEASE_RESULT\`"
            echo "- Release: $RELEASE_URL"
          } >> "$GITHUB_STEP_SUMMARY"

  notify-slack:
    name: Notify Slack
    needs: [deploy, release]
    uses: ./.github/workflows/slack-notification.yml
    with:
      kind: deployment
      status: success
      environment: staging
      tag: ${{ inputs.tag }}
      repository_url: ${{ format('{0}/{1}', github.server_url, github.repository) }}
      version_url: ${{ format('{0}/{1}/releases/tag/{2}', github.server_url, github.repository, inputs.tag) }}
      release_created: ${{ needs.release.outputs.created == 'true' }}
      workflow_url: ${{ format('{0}/{1}/actions/runs/{2}', github.server_url, github.repository, github.run_id) }}
    secrets:
      slack_bot_token: ${{ secrets.ALPON_WATCHDOG_SLACK_BOT_TOKEN }}
      slack_channel_id: ${{ secrets.SLACK_CHANNEL_ID }}
